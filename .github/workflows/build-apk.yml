name: Build VoxAssist APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxAssist-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.2.0-mcxw71
          name: "VoxAssist v1.2.0 (FRDM-MCXW71 + White Theme)"
          body: |
            ### 📱 VoxAssist v1.2.0 APK Release
            - **Target Microcontroller:** NXP FRDM-MCXW71 (BLE 5.3)
            - **Audio Input:** 3.5mm Female AUX Connector (PTA16 ADC0)
            - **Audio Output:** Board Speaker via PAM8403 / MAX98357A (PTB1 PWM)
            - **UI Theme:** Crisp High-Contrast Professional White Theme
            - **Settings Hub:** Connected Devices & Nearby Bluetooth Scanner
            - **WhatsApp:** Zero-Touch Auto-Send & Spoken Reply Interception ("Read out" / "What is the reply")
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
